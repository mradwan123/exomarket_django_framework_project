{% extends "base.html" %}
{% block title %}
    Create Item in Database 
{% endblock %}


{% block header %}
    Create Item
{% endblock %}

{% block content %}
<h3>Enter details of item you would like to create below:</h3>
<form method="POST" enctype="multipart/form-data">
    
    {% csrf_token %}
    {{ form.as_p }}

</form>
 {% endblock %}
