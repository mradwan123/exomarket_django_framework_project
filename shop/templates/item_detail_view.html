{% extends "base.html" %}
{% block header %}{% endblock %}
{% block title %}View Details of Items {% endblock %}


{% block content %}

<h1>Details of Item: </h1>

<ul>
    {% for i in all_items %}
        <li>{{ i }}</li>
<a href="{% url 'shop:detail' i.pk %}">Item details</a>
    {% endfor %}
</ul>

{% endblock %}
