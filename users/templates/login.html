{% extends "base.html" %}
{% load static %}
{% block title %}User Login Page{% endblock %}


{% block content %}

<h1>{{ title }}</h1>
<p><b>Hello {{ user }}</b></p>
<img src="{% static 'img/cat.jpg' %}" width="300">


<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
   
    <button type="submit">Press Enter to Login </button>
   
</form>


{% endblock %}
